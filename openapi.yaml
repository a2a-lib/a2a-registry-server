openapi: 3.1.0
info:
  title: A2A Registry API
  version: 0.2.5
  description: Lease-based registration and discovery for logical A2A agents with independently leased runtime instances. This registry API is not an A2A task/message transport.
servers:
  - url: http://localhost:3003
paths:
  /v1:
    get:
      summary: Get registry server metadata
      description: Returns public information about the running registry for dashboards and API clients.
      responses:
        '200':
          description: Registry server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
  /v1/agents:
    post:
      summary: Register an agent instance
      description: Registrations without instanceId receive a unique server-generated instance ID. The response always includes the assigned instance.
      security:
        - writeToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Registered. The lease token is returned only on creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      summary: Discover active agents
      parameters:
        - { name: skill, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: capability, in: query, schema: { type: string } }
        - { name: protocolBinding, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Matching logical agents with at least one active instance
          content:
            application/json:
              schema:
                type: object
                required: [agents, total, revision]
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/RegisteredAgent' } }
                  total: { type: integer }
                  nextCursor: { type: string }
                  revision: { type: integer }
  /v1/watch:
    get:
      summary: Watch revisioned registry snapshots
      description: Streams Server-Sent Events. Use after or Last-Event-ID to resume after a known revision.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Registry snapshot stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: Get a logical agent and its active instances
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/RegisteredAgent' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Register an instance (generating its ID when omitted)
      security:
        - leaseToken: []
        - writeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInputWithoutId'
      responses:
        '200': { description: Updated }
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Unregister the generated or compatibility instance
      security:
        - leaseToken: []
        - writeToken: []
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/agents/{id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      summary: Renew the generated or compatibility instance lease
      security:
        - leaseToken: []
        - writeToken: []
      responses:
        '200': { description: Lease renewed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/agents/{id}/instances:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: List active instances of a logical agent
      responses:
        '200':
          description: Active instances
          content:
            application/json:
              schema:
                type: object
                required: [instances, total]
                properties:
                  instances: { type: array, items: { $ref: '#/components/schemas/AgentInstance' } }
                  total: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: Register a named instance under a logical agent
      security:
        - writeToken: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceRegistrationInput' }
      responses:
        '200': { description: Updated }
        '201':
          description: Registered with a new per-instance lease token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/agents/{id}/instances/{instanceId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/InstanceId'
    get:
      summary: Get one active agent instance
      responses:
        '200': { description: Active instance }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      summary: Create or replace one named instance
      security:
        - leaseToken: []
        - writeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInputWithoutId' }
      responses:
        '200': { description: Updated }
        '201': { description: Registered }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Unregister one named instance
      security:
        - leaseToken: []
        - writeToken: []
      responses:
        '204': { description: Unregistered }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/agents/{id}/instances/{instanceId}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/InstanceId'
    post:
      summary: Renew one named instance lease
      security:
        - leaseToken: []
        - writeToken: []
      responses:
        '200': { description: Lease renewed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      summary: Storage readiness
      responses:
        '200': { description: Ready }
        '503': { description: Storage unavailable }
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics
          content:
            text/plain: { schema: { type: string } }
components:
  securitySchemes:
    writeToken:
      type: http
      scheme: bearer
    leaseToken:
      type: apiKey
      in: header
      name: X-Registry-Lease-Token
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$' }
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$' }
  responses:
    Problem:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ServerInfo:
      type: object
      required: [name, version, apiVersion, url, status, store, documentation, endpoints]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string }
        url: { type: string, format: uri }
        status: { type: string, enum: [ready, not_ready] }
        store: { type: string }
        documentation: { type: string, format: uri }
        endpoints: { type: object, additionalProperties: { type: string } }
    AgentCard:
      type: object
      description: A2A Agent Card. Unknown fields are preserved for forward compatibility.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: string }
        supportedInterfaces:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              protocolBinding: { type: string }
              protocolVersion: { type: string }
        capabilities: { type: object, additionalProperties: true }
        skills: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    RegistrationInput:
      allOf:
        - $ref: '#/components/schemas/RegistrationInputWithoutId'
        - type: object
          required: [id]
          properties:
            id: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$' }
            instanceId: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$', description: Optional. A unique UUID is generated when omitted. }
    InstanceRegistrationInput:
      allOf:
        - $ref: '#/components/schemas/RegistrationInputWithoutId'
        - type: object
          required: [instanceId]
          properties:
            instanceId: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$' }
    RegistrationInputWithoutId:
      type: object
      required: [agentCard]
      properties:
        endpoint: { type: string, format: uri }
        agentCard: { $ref: '#/components/schemas/AgentCard' }
        ttlSeconds: { type: integer, minimum: 1 }
        metadata: { type: object, additionalProperties: { type: string } }
        healthCheck: { $ref: '#/components/schemas/HealthCheckConfig' }
    RegisteredAgent:
      type: object
      required: [id, name, agentCard, instances, instanceCount, endpoint, ttlSeconds, registeredAt, updatedAt, lastSeen, expiresAt, metadata, revision]
      properties:
        id: { type: string }
        name: { type: string }
        agentCard: { $ref: '#/components/schemas/AgentCard' }
        instances: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AgentInstance' } }
        instanceCount: { type: integer, minimum: 1 }
        endpoint: { type: string, format: uri, description: Compatibility projection of the first active instance, preferring an explicitly named default instance. }
        ttlSeconds: { type: integer }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: { type: string } }
        revision: { type: integer }
    AgentInstance:
      type: object
      required: [instanceId, endpoint, ttlSeconds, registeredAt, updatedAt, lastSeen, expiresAt, metadata, revision]
      properties:
        instanceId: { type: string }
        endpoint: { type: string, format: uri }
        ttlSeconds: { type: integer }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: { type: string } }
        healthCheck: { $ref: '#/components/schemas/HealthCheckConfig' }
        health: { $ref: '#/components/schemas/HealthStatus' }
        revision: { type: integer }
    HealthCheckConfig:
      type: object
      properties:
        protocol: { type: string, enum: [http, tcp], default: http }
        path: { type: string, pattern: '^/[^\\\\]*$' }
        intervalSeconds: { type: integer, minimum: 1, maximum: 3600, default: 10 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 30, default: 5 }
    HealthStatus:
      type: object
      required: [status, consecutiveFailures]
      properties:
        status: { type: string, enum: [unknown, passing, warning, critical] }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer, minimum: 0 }
        consecutiveFailures: { type: integer, minimum: 0 }
        error: { type: string }
    RegistrationResponse:
      type: object
      required: [status, agent, instance]
      properties:
        status: { type: string, enum: [registered, updated] }
        agent: { $ref: '#/components/schemas/RegisteredAgent' }
        instance: { $ref: '#/components/schemas/AgentInstance' }
        leaseToken: { type: string, description: Returned only when a registration is created. }
    Problem:
      type: object
      required: [type, title, status, detail, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
